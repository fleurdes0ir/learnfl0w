name: branch-policy

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate head branch name and PR target
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -eu
          echo "PR: $HEAD -> $BASE"
          if [ "$BASE" = "dev" ]; then
            if echo "$HEAD" | grep -Eq '^(feat|fix|chore)/[a-z0-9._-]+$'; then
              echo "ok"; exit 0
            fi
            echo "::error::PR ke 'dev' harus dari cabang feat/, fix/, atau chore/ (huruf kecil, angka, titik, garis)."
            exit 1
          fi
          if [ "$BASE" = "main" ]; then
            if [ "$HEAD" = "dev" ] || echo "$HEAD" | grep -Eq '^fix/[a-z0-9._-]+$'; then
              echo "ok"; exit 0
            fi
            echo "::error::PR ke 'main' hanya dari 'dev' (rilis) atau 'fix/...' (perbaikan kritis)."
            exit 1
          fi
